# L'interface Wi-Fi sur laquelle on travaille
interface=wlan1
# Plage d'adresses IP pour les élèves (de .10 à .50)
dhcp-range=192.168.1.10,192.168.1.50,255.255.255.0,12h
# Redirige TOUS les noms de domaine vers ton serveur, pas juste un seul —
# c'est ce qui permet au téléphone de détecter le portail captif et
# d'ouvrir automatiquement la page, quelle que soit l'adresse qu'il teste.
address=/#/192.168.1.1
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.1
cache-size=1000
