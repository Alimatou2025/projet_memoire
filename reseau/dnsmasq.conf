# L'interface Wi-Fi sur laquelle on travaille
interface=wlan0

# Plage d'adresses IP pour les élèves (de .10 à .50)
# Ils resteront connectés pendant 12 heures
dhcp-range=192.168.1.10,192.168.1.50,255.255.255.0,12h

# On définit l'adresse IP de ton serveur (la borne)
address=/Monespace.sn/192.168.1.1

# DNS : On dit aux téléphones que le serveur est leur passerelle
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.1

# Pour que le DNS soit rapide
cache-size=1000
